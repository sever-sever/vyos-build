
# https://clixon-controller-docs.readthedocs.io/en/latest/overview.html

[[packages]]
name = "cligen"
commit_id = "7.2.0"
scm_url = "https://github.com/clicon/cligen.git"

pre_build_hook = """
sudo useradd clicon -N
sudo groupadd clicon
sudo usermod -a -G clicon `whoami`
"""

build_cmd = """
./configure && make && sudo make install; sudo ldconfig
./scripts/build_deb.sh
"""


